# ============================================
# NOM DE L'APPLICATION
# ============================================
spring.application.name=MomyCare

# ============================================
# CONFIGURATION DE LA BASE DE DONNEES (MySql)
# ============================================
spring.datasource.url=jdbc:mysql://localhost:3306/app_sante?useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ============================================
# JPA / Hibernate
# ============================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ============================================
# SERVEUR
# ============================================
server.port=8081


# ============================================
# SECURITE BASIC (si utilise)
# ============================================
spring.security.user.name=admin
spring.security.user.password=admin

# Desactiver CSRF si vous utilisez uniquement des APIs
spring.security.enable-csrf=false
spring.security.default-target-url=/home

# ============================================
# TAILLE MAX DES FICHIERS UPLOAD
# ============================================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ============================================
# CONFIGURATION DE JWT
# ============================================
spring.app.jwtSecret=1234567890123456789012345678901234567890123456789012345678901234
# 24 heures (86400000 ms)
spring.app.jwtExpirationMs=86400000
spring.app.jwtCookieName=MomyCareToken
spring.app.cookieSecure=false

# ============================================
# CONFIGURATION CLAMAV
# ============================================
clamav.host=localhost
clamav.port=3310
clamav.enabled=true



